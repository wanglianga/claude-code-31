name: ${COMPOSE_PROJECT_NAME:-wedding-banquet}

services:
  # 数据库：仅 compose 内部网络访问，不发布到宿主端口
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wedding}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wedding123}
      POSTGRES_DB: ${POSTGRES_DB:-wedding}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # 应用：唯一对外服务，宿主端口由 CC_PUBLISH_PORT 指定
  app:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-wedding}:${POSTGRES_PASSWORD:-wedding123}@db:5432/${POSTGRES_DB:-wedding}
      TOKEN_SECRET: ${TOKEN_SECRET:-wedding-dev-secret}
      SEED_DEMO: ${SEED_DEMO:-true}
    ports:
      - "${CC_PUBLISH_PORT:-8080}:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
